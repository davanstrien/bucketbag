name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/tests.yml  # a tag publishes only a commit that passes the suite

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC): no tokens anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --no-config
      - run: uv publish --trusted-publishing always
