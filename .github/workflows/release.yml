name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/tests.yml  # a tag publishes only a commit that passes the suite

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read  # checkout and the main-branch check
      id-token: write  # PyPI trusted publishing (OIDC): no tokens anywhere
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # the full history, for the main-branch check below
      - name: Publish only a commit that is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build --no-config
      # --check-url: a re-run after a partial upload skips files PyPI already has
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
