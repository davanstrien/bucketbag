name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs the full suite before publishing

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Backstop if a test hangs outside pytest-timeout's reach.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise the requires-python floor (3.10) and a recent interpreter, so
        # 3.10-incompatible code can't ship green on whatever uv happens to pick.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked (not --frozen) fails CI if uv.lock has drifted from pyproject.toml.
      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python-version }}

      # ruff is a locked dev dependency, so CI runs the pinned version (not whatever
      # uvx fetches from PyPI), keeping lint stable across releases and contributors.
      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync ty check

      - name: Pytest
        run: uv run --no-sync pytest
