[project]
name = "bucketbag"
version = "0.4.0"
description = "A minimal, toolz-style helper for batched, bounded-memory access to Hugging Face bucket files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Daniel van Strien" }]
keywords = ["huggingface", "buckets", "batch", "toolz", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # 1.21: parse_hf_uri reads Hub web URLs (1.13 rejects them).
    "huggingface-hub>=1.21",
    "hf-xet>=1.5.2",
    # 2023.12: fsspec.utils.glob_translate, the glob rules HfFileSystem.glob uses.
    "fsspec>=2023.12",
    "toolz",
    "pillow",
]

[project.urls]
Homepage = "https://github.com/davanstrien/bucketbag"
Repository = "https://github.com/davanstrien/bucketbag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bucketbag"]

[tool.hatch.build.targets.sdist]
# Only what a source build and its tests need; never local venvs or experiment outputs.
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRACT.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ANN: the package and its tests are fully typed. C90/PLR09: a complexity ratchet; no function
# may grow past these limits.
select = ["E", "F", "I", "UP", "B", "ANN", "C90", "PLR0912", "PLR0915"]
# Any is deliberate where the type is the caller's (LoadedItem.json(), setup() results).
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Scripts, not library code: examples measure things, experiments vendor recipe code unchanged.
"examples/**" = ["ANN", "C90", "PLR"]
"experiments/**" = ["B905", "ANN", "C90", "PLR"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# pyarrow is an optional import in completed_keys, not a bucketbag dependency.
allowed-unresolved-imports = ["pyarrow.**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# A test stuck for 120 s dumps every thread's stack and ends the run. The thread method is
# needed: with the signal method a stuck prefetch worker still blocks the process from exiting.
timeout = 120
timeout_method = "thread"

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4",
    "ruff>=0.15",
    "ty>=0.0.91",
]

# Pin the index to public PyPI so the lockfile resolves against the canonical registry,
# independent of any ambient uv config (e.g. a machine-local index-url). This keeps
# `uv sync` reproducible for CI and other contributors.
#
# Same class of problem, second instance: regenerate the lock with `uv lock --no-config`.
# A machine-global `exclude-newer` otherwise bakes an `[options]` block into uv.lock that
# CI (with no such config) rejects under `--locked`. Locally, prefer
# `uv sync --frozen` / `uv run --no-sync` to avoid churning the lock back.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
